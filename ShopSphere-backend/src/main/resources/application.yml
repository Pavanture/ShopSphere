server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: shopsphere

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shopsphere_db}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}


  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  qikink:
    enabled: ${QIKINK_ENABLED:false}
    base-url: ${QIKINK_BASE_URL:https://sandbox.qikink.com}
    client-id: ${QIKINK_CLIENT_ID:}
    client-secret: ${QIKINK_CLIENT_SECRET:}
    gateway: ${QIKINK_GATEWAY:COD}
    shipping: ${QIKINK_SHIPPING:1}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.shopsphere: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}